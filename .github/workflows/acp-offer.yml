name: acp-offer
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  st:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @virtuals-protocol/acp-cli
      - run: |
          set +e
          mkdir -p acp-home-x
          export ACP_CONFIG_DIR=$PWD/acp-home-x
          acp configure complete --request-id "f233ee8f475226fd9526bad6fc3f6eef" --json > cfg.json 2>&1; echo "CFG_EXIT=$?"
          acp agent use --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" > use.txt 2>&1; echo "USE_EXIT=$?"
          cat use.txt; echo
          echo "---CREATE-HELP---"
          acp offering create --help > create-help.txt 2>&1; head -c 3000 create-help.txt; echo
          echo "---OFFERING-LIST---"
          acp offering list --json > offerings.json 2>&1; echo "EXIT_L=$?"
          head -c 3000 offerings.json; echo
          echo "---BROWSE-SCOUT---"
          acp browse "bounty research scout" --top-k 10 --json > browse.json 2>browse.err; echo "EXIT_B=$?"
          head -c 4000 browse.json; echo; echo "---BERR---"; head -c 500 browse.err; echo
          echo DONE > done.txt
          exit 0
      - name: commit results
        if: always()
        run: |
          git config user.name "doishy-doish"
          git config user.email "doishy-doish@users.noreply.github.com"
          git checkout -B acp-offer
          for f in cfg.json use.txt create-help.txt offerings.json browse.json browse.err done.txt; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m "offering recon 2" || echo NO_CHANGES
          git push -f origin acp-offer
