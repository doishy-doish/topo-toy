name: acp-offer2
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  st:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @virtuals-protocol/acp-cli
      - run: |
          set +e
          mkdir -p acp-home-x
          export ACP_CONFIG_DIR=$PWD/acp-home-x
          echo "---COMPLETE-A---"
          acp configure complete --request-id "acp-45c2e35dc393f80f4564" --json > cfgA.json 2>&1; echo "EXIT_A=$?"
          head -c 1200 cfgA.json; echo
          acp agent use --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" > useA.txt 2>&1; echo "USE_A=$?"
          head -c 600 useA.txt; echo
          if grep -q "success" useA.txt 2>/dev/null; then echo "AUTH=A" > auth.txt;
          else
            echo "---COMPLETE-B---"
            acp configure complete --request-id "5e1cd04805de5e5c7cd208c35ec5e46f" --json > cfgB.json 2>&1; echo "EXIT_B=$?"
            head -c 1200 cfgB.json; echo
            acp agent use --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" > useB.txt 2>&1; echo "USE_B=$?"
            head -c 600 useB.txt; echo
            if grep -q "success" useB.txt 2>/dev/null; then echo "AUTH=B" > auth.txt; else echo "AUTH=NONE" > auth.txt; fi
          fi
          cat auth.txt
          if grep -q "AUTH=A\|AUTH=B" auth.txt; then
            echo "---OFFERING-CREATE---"
            acp offering create --name "Bounty Triage Scout" --description "Same-day triage of bug-bounty leads for EVM and Solana repos: validity scoring, duplicate check, and a fix-plan sketch, delivered as a structured report." --price-type fixed --price-value 10 --sla-minutes 1440 --requirements "Repo URL and bounty brief" --deliverable "Triage report (JSON plus markdown)" --required-funds --no-hidden --json > offering-created.json 2>offering-created.err; echo "EXIT_C=$?"
            head -c 3000 offering-created.json; echo; echo "---CERR---"; head -c 800 offering-created.err; echo
            echo "---OFFERING-LIST---"
            acp offering list --json > offerings.json 2>&1; echo "EXIT_L=$?"
            head -c 4000 offerings.json; echo
            echo "---BROWSE1---"
            acp browse "security audit" --top-k 10 --json > browse1.json 2>browse1.err; echo "EXIT_B1=$?"
            head -c 4000 browse1.json; echo
            echo "---BROWSE2---"
            acp browse "bounty" --top-k 10 --mode mixed --json > browse2.json 2>browse2.err; echo "EXIT_B2=$?"
            head -c 4000 browse2.json; echo
          fi
          echo DONE > done.txt
          exit 0
      - name: commit results
        if: always()
        run: |
          git config user.name "doishy-doish"
          git config user.email "doishy-doish@users.noreply.github.com"
          git checkout -B acp-offer2
          for f in cfgA.json cfgB.json useA.txt useB.txt auth.txt offering-created.json offering-created.err offerings.json browse1.json browse1.err browse2.json browse2.err done.txt; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m "auth A/B plus offering" || echo NO_CHANGES
          git push -f origin acp-offer2
