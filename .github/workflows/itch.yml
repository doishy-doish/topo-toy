name: itch
on:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/itch.yml]
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d butler && chmod +x butler/butler
          mkdir -p web && cp index.html web/
          ./butler/butler push web doishy-doish/toposys:html5
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
