name: itch
on:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/itch.yml]
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch butler
        run: |
          curl -sL -o butler.zip https://github.com/itchio/butler/releases/download/v15.32.0/butler-linux-amd64.zip
          ls -la butler.zip && file butler.zip || true
      - name: unpack
        run: |
          unzip -o butler.zip -d butler && chmod +x butler/butler
          ./butler/butler -V
      - name: stage web dir
        run: |
          mkdir -p web && cp index.html web/ && ls -la web/
      - name: push to itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler/butler push web doishy-doish/toposys:html5
