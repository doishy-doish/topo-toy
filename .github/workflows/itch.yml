# itch embed dashboard (set on itch.io, NOT in this file):
#   Embed in page ✓ | auto-start ON | fullscreen button ON | scrollbars OFF | mobile-friendly ON
#   Viewport portrait  = 800 wide x 1000 tall (vertical game frame)
#   Viewport landscape = 1000 wide x 800 tall (horizontal game frame)
#   The page canvas caps at 720 px wide + ~250 px chrome, so 800x1000 fits
#   portrait without scrollbars and 1000x800 fits landscape.
#   (Earlier note wrote "800x100" and told the operator to also enable landscape
#   on a portrait frame — that was wrong; landscape = the 1000x800 frame.)
#   SharedArrayBuffer stays OFF (single-threaded SINGLE_FILE wasm, no COOP/COEP need).
name: itch
on:
  push:
    branches: [main]
    paths: [index.html, vendor/**, .github/workflows/itch.yml]
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch butler
        run: |
          curl -fSL -o butler.zip https://github.com/itchio/butler/releases/download/v15.32.0/butler-linux-amd64.zip
          python3 -c "import zipfile; z=zipfile.ZipFile('butler.zip'); bad=z.testzip(); print('zip ok, entries:', len(z.namelist()), 'bad:', bad); assert bad is None"
      - name: unpack
        run: |
          python3 -c "import zipfile; z=zipfile.ZipFile('butler.zip'); print(z.namelist()); z.extractall('butler')"
          chmod +x butler/linux-amd64/butler
          ls -la butler/linux-amd64/
      - name: stage web dir
        run: |
          mkdir -p web && cp index.html web/ && cp -r vendor web/ && ls -la web/ web/vendor/
      - name: push to itch
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler/linux-amd64/butler push web doishy-doish/toposys:html5
