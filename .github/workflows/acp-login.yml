name: acp-login
on:
  workflow_dispatch:
    inputs:
      seal_pubkey:
        description: 'Repo secrets public key (base64)'
        required: true
      key_id:
        description: 'Repo secrets key id'
        required: true
permissions: { contents: write }
jobs:
  login-wait:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g @virtuals-protocol/acp-cli
      - name: configure start
        run: |
          mkdir -p acp-home-login
          export ACP_CONFIG_DIR=$PWD/acp-home-login
          acp configure start --json | tee start.json
          echo "ACP_START_DONE"
      - name: publish login URL for operator
        run: |
          node -e "const j=require('./start.json');console.log('LOGIN_URL='+j.url);console.log('LOGIN_REQ='+j.requestId)"
          git config user.name "doishy-doish"
          git config user.email "doishy-doish@users.noreply.github.com"
          git checkout -B acp-minibrowser
          cp start.json acp-login-start.json
          git add -f acp-login-start.json
          git commit -m "acp login url $(date -u +%FT%TZ)" || echo NO_CHANGES
          git push -f origin acp-minibrowser
      - name: wait for operator login then complete
        run: |
          export ACP_CONFIG_DIR=$PWD/acp-home-login
          REQ=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('start.json','utf8')).requestId||'')}catch(e){console.log('')}")
          echo "REQUEST_ID=$REQ"
          DONE=0
          for i in $(seq 1 120); do
            if acp configure complete --request-id "$REQ" --json > complete.json 2>complete.err; then
              ST=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('complete.json','utf8')).status||'')}catch(e){console.log('')}")
              if [ "$((i % 15))" = "0" ]; then echo "poll $i status=$ST"; fi
              if [ "$ST" != "pending" ] && [ -n "$ST" ]; then echo ACP_COMPLETE_OK; DONE=1; break; fi
            else
              echo "poll $i exit nonzero"
            fi
            sleep 20
          done
          [ "$DONE" = "1" ] && echo HAVE_COMPLETE || echo NO_COMPLETE_YET
      - name: seal result to repo secret public key
        if: always()
        env:
          SEAL_PUBKEY: ${{ inputs.seal_pubkey }}
        run: |
          pip install -q pynacl
          python3 - <<'PYEOF'
          import base64, os
          from nacl.public import PublicKey, SealedBox
          pub = PublicKey(base64.b64decode(os.environ['SEAL_PUBKEY']))
          box = SealedBox(pub)
          data = b''
          for f in ['complete.json', 'start.json']:
              try:
                  data += b'\n---' + f.encode() + b'---\n' + open(f,'rb').read()
              except Exception:
                  pass
          open('sealed.box','wb').write(base64.b64encode(box.encrypt(data if data else b'NO_COMPLETE')))
          print('SEALED_WROTE')
          PYEOF
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: acp-sealed, path: sealed.box }
