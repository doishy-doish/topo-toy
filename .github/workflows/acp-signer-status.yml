name: acp-signer-status
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  st:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g @virtuals-protocol/acp-cli
      - run: |
          set +e
          mkdir -p acp-home-x
          export ACP_CONFIG_DIR=$PWD/acp-home-x
          acp configure complete --request-id "f233ee8f475226fd9526bad6fc3f6eef" --json > cfg.json 2>&1; echo "CFG_EXIT=$?"
          acp agent use --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" > use.txt 2>&1; echo "USE_EXIT=$?"
          echo "---SIGNER-STATUS fa8f---"
          acp agent signer-status --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" --request-id "fa8f19c1af5e07c09c488a5ea344baf5" --public-key "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEFOnPjD1vp2H+UR+YjMguY03A71WGCJbIYmxrhUV6AOtwDOy1+YTtDlTuBIUYuiBc9BUWmVwUppZQilphf4E2aQ==" --json > signer-done.json 2>signer-done.err; echo "EXIT_DONE=$?"
          head -c 2000 signer-done.json; echo; echo "---ERR---"; head -c 800 signer-done.err; echo
          echo "---SIGNER-POLICY---"
          acp agent signer-policy --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" --json > signer-policy.json 2>&1; echo "EXIT_POL=$?"
          head -c 1500 signer-policy.json; echo
          echo "---WHOAMI---"
          acp agent whoami --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" --json > whoami.json 2>&1 || acp agent whoami > whoami.json 2>&1; echo "EXIT_WHO=$?"
          head -c 1500 whoami.json; echo
          echo DONE > done.txt
          exit 0
      - name: commit results
        if: always()
        run: |
          git config user.name "doishy-doish"
          git config user.email "doishy-doish@users.noreply.github.com"
          git checkout -B acp-signer-status
          for f in cfg.json use.txt signer-done.json signer-done.err signer-policy.json whoami.json done.txt; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m "signer complete fa8f" || echo NO_CHANGES
          git push -f origin acp-signer-status
