name: gohybrid-sound-probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: clone Go-Hybrid main
        run: git clone --depth 1 https://github.com/limitlessprojects/Go-Hybrid /tmp/gohybrid
      - name: soundness adjacent probes
        working-directory: /tmp/gohybrid/compiler
        run: |
          set +e
          cat > crates/hy-check/tests/zz_sound_probe.rs <<'RS'
          use hy_check::check_file;
          fn verdict(src: &str) -> String {
            match hy_syntax::parse_file("probe.hy", src) {
              Err(e) => format!("ParseErr {:?}", e).chars().take(300).collect(),
              Ok(ast) => {
                let r = check_file(&ast);
                let codes: Vec<String> = r.diagnostics.iter().map(|d| d.code.clone()).collect();
                format!("{:?} codes={:?} n={}", r.verdict, codes, r.diagnostics.len())
              }
            }
          }
          #[test]
          fn sound_adjacent_matrix() {
            let cases: Vec<(&str, &str)> = vec![
              ("A2_assoc_generic_low", "const seed = map[string]int{\"a\": 1}\nstruct ops {}\nfn ops.clobber_gen[t any](m map[string]t, v t) {\n    m[\"a\"] = v\n}\nfn main() {\n    ops.clobber_gen[int](seed, 42)\n}\n"),
              ("B2_fnvalue_low", "const seed = map[string]int{\"a\": 1}\nstruct ops {}\nfn ops.clobber(m map[string]int) {\n    m[\"a\"] = 99\n}\nfn main() {\n    f := ops.clobber\n    f(seed)\n}\n"),
              ("G_inferred_assoc_generic", "const seed = map[string]int{\"a\": 1}\nstruct ops {}\nfn ops.clobber_gen[t any](m map[string]t, v t) {\n    m[\"a\"] = v\n}\nfn main() {\n    ops.clobber_gen(seed, 42)\n}\n"),
              ("H_inferred_link", "struct holder {\n    m map[string]int\n}\nfn link[t any](h *holder, x map[string]t) {\n    h.m = x\n}\nfn worker(h holder, done chan int) {\n    h.m[\"worker\"] = 1\n    done <- 1\n}\nfn main() {\n    m := map[string]int{\"init\": 0}\n    var h holder\n    link(&h, m)\n    done := make(chan int, 1)\n    task worker(move h, done)\n    m[\"main\"] = 2\n    <-done\n}\n"),
              ("I_nested_if_move_before_exit", "fn worker(m map[string]int, done chan int) {\n    m[\"worker\"] = 1\n    done <- 1\n}\nfn main() {\n    done := make(chan int, 1)\n    if true {\n        m := map[string]int{\"k\": 1}\n        if true {\n            defer (fn() {\n                m[\"k\"] = 2\n            })()\n            task worker(move m, done)\n        }\n    }\n    <-done\n}\n"),
              ("J_closure_after_move_same_block", "fn worker(m map[string]int, done chan int) {\n    m[\"worker\"] = 1\n    done <- 1\n}\nfn main() {\n    done := make(chan int, 1)\n    m := map[string]int{\"k\": 1}\n    task worker(move m, done)\n    defer (fn() {\n        m[\"k\"] = 2\n    })()\n    <-done\n}\n"),
            ];
            let mut out = String::new();
            for (name, src) in &cases {
              let v = verdict(src);
              eprintln!("CASE {name} {v}");
              out.push_str(&format!("{name} {v}\n"));
            }
            let ws = std::env::var("GITHUB_WORKSPACE").unwrap_or("/tmp".to_string());
            std::fs::write(format!("{ws}/sound_matrix.txt"), &out).ok();
            std::fs::write("/tmp/sound_matrix.txt", &out).ok();
          }
          RS
          cargo test -p hy-check --test zz_sound_probe -- --nocapture 2>&1 | tail -30
          echo "---MATRIX---"
          cat /tmp/sound_matrix.txt 2>/dev/null || echo "no matrix"
          cp /tmp/sound_matrix.txt $GITHUB_WORKSPACE/sound_matrix.txt 2>/dev/null || true
          exit 0
      - name: publish matrix
        run: |
          set +e
          git checkout -B gohybrid-sound-probe
          cp /tmp/sound_matrix.txt ./sound_matrix.txt 2>/dev/null || true
          if [ -f ./sound_matrix.txt ]; then git add sound_matrix.txt; git -c user.name=probe -c user.email=probe@local commit -m "sound matrix v3" || true; git push -u origin gohybrid-sound-probe --force; fi
          exit 0
