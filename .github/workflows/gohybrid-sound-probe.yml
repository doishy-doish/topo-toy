name: gohybrid-sound-probe
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: clone Go-Hybrid main
        run: git clone --depth 1 https://github.com/limitlessprojects/Go-Hybrid /tmp/gohybrid
      - name: confirm B2 unique
        working-directory: /tmp/gohybrid/compiler
        run: |
          set +e
          cat > crates/hy-check/tests/zz_sound_probe.rs <<'RS'
          use hy_check::check_file;
          fn verdict(src: &str) -> String {
            match hy_syntax::parse_file("probe.hy", src) {
              Err(e) => format!("ParseErr {:?}", e).chars().take(200).collect(),
              Ok(ast) => {
                let r = check_file(&ast);
                let codes: Vec<String> = r.diagnostics.iter().map(|d| (d.code.clone()+":"+&d.message.chars().take(120).collect::<String>())).collect();
                format!("{:?} n={} {:?} HEAD_PLACEHOLDER", r.verdict, r.diagnostics.len(), codes)
              }
            }
          }
          #[test]
          fn confirm_b2() {
            let head = "HEAD_UNKNOWN";
            let direct = "const seed = map[string]int{\"a\": 1}\nstruct ops {}\nfn ops.clobber(m map[string]int) {\n    m[\"a\"] = 99\n}\nfn main() {\n    ops.clobber(seed)\n}\n";
            let alias = "const seed = map[string]int{\"a\": 1}\nstruct ops {}\nfn ops.clobber(m map[string]int) {\n    m[\"a\"] = 99\n}\nfn main() {\n    f := ops.clobber\n    f(seed)\n}\n";
            let vd = verdict(direct);
            let va = verdict(alias);
            eprintln!("DIRECT {vd}");
            eprintln!("ALIAS {va}");
            let ws = std::env::var("GITHUB_WORKSPACE").unwrap_or("/tmp".to_string());
            let head2 = std::process::Command::new("git").args(["-C","/tmp/gohybrid","rev-parse","HEAD"]).output().map(|o| String::from_utf8_lossy(&o.stdout).trim().to_string()).unwrap_or("unknown".into());
            let out = format!("head={head2}\ndirect {vd}\nalias {va}\n");
            std::fs::write(format!("{ws}/sound_matrix.txt"), &out).ok();
            std::fs::write("/tmp/sound_matrix.txt", &out).ok();
          }
          RS
          sed -i "s/HEAD_PLACEHOLDER//" crates/hy-check/tests/zz_sound_probe.rs || true
          cargo test -p hy-check --test zz_sound_probe -- --nocapture 2>&1 | tail -25
          cp /tmp/sound_matrix.txt $GITHUB_WORKSPACE/sound_matrix.txt 2>/dev/null || true
          exit 0
      - name: publish matrix
        run: |
          set +e
          git checkout -B gohybrid-sound-probe
          cp /tmp/sound_matrix.txt ./sound_matrix.txt 2>/dev/null || true
          if [ -f ./sound_matrix.txt ]; then git add sound_matrix.txt; git -c user.name=probe -c user.email=probe@local commit -m "confirm b2" || true; git push -u origin gohybrid-sound-probe --force; fi
          exit 0
