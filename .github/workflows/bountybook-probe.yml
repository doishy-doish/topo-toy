name: bountybook-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe bountybook api
        run: |
          echo "=== root ==="
          curl -sS -m 30 -i https://api.bountybook.ai/ || echo "root-fail $?"
          echo "=== job ==="
          curl -sS -m 30 -i https://api.bountybook.ai/jobs/740fd768-1dcb-410c-a7ad-c64ac8be50af -o /tmp/job.json || echo "job-fail $?"
          echo "=== head ==="
          head -c 2000 /tmp/job.json || true
          echo ""
          echo "=== jobbi ==="
          curl -sS -m 30 https://jobbi.org/gigs.json -o /tmp/gigs.json && echo "gigs-bytes $(wc -c < /tmp/gigs.json)" || echo "gigs-fail $?"
