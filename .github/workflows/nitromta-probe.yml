name: nitromta-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Strict NitroMTA version check (no claim)
        run: |
          set -e
          uname -a
          docker --version
          docker pull ghcr.io/nitrosend/nitromta:latest
          docker run --rm ghcr.io/nitrosend/nitromta:latest --version
          echo "STRICT_PROBE_DONE"
