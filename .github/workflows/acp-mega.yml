name: acp-mega
on: [workflow_dispatch]
permissions:
  contents: write
  actions: write
jobs:
  st:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: acp-home-x, key: acp-keystore-v2 }
      - run: npm i -g @virtuals-protocol/acp-cli
      - run: |
          set +e
          mkdir -p acp-home-x
          export ACP_CONFIG_DIR=$PWD/acp-home-x
          git config user.name "doishy-doish"
          git config user.email "doishy-doish@users.noreply.github.com"
          acp configure complete --request-id "22f0d11dc767c9dcffa3ba25b0442717" --json > cfg.json 2>&1
          acp agent use --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" > use.txt 2>&1
          if grep -q "success" use.txt 2>/dev/null; then echo "AUTH=YES" > auth.txt; else echo "AUTH=NO" > auth.txt; fi
          cat auth.txt
          if grep -q "AUTH=NO" auth.txt; then
            acp configure start --json > login.json 2>/dev/null
            git checkout -B acp-mega
            git add -f login.json cfg.json auth.txt
            git commit -m "need login" || true
            git push -f origin acp-mega
            echo DONE > done.txt; exit 0
          fi
          echo "---ADD-SIGNER---"
          acp agent add-signer --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" --policy restricted --no-wait --json > mega.json 2>mega.err; echo "EXIT_S=$?"
          cat mega.json; echo
          node -e 'console.log(JSON.parse(require("fs").readFileSync("mega.json","utf8")).signerUrl)' > mega-url.txt 2>/dev/null || echo URLPARSE_FAIL > mega-url.txt
          cat mega-url.txt
          git checkout -B acp-mega
          git add -f mega.json mega-url.txt cfg.json auth.txt
          git commit -m "awaiting approval" || true
          git push -f origin acp-mega
          echo "---POLL-SIGNER-STATUS---"
          SREQ=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("mega.json","utf8")).requestId)')
          SPUB=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("mega.json","utf8")).publicKey)')
          echo "SREQ=$SREQ"
          touch MARKER
          for i in $(seq 1 16); do
            sleep 15
            acp agent signer-status --agent-id "01a1b6b0-fdab-70af-bab3-e3f971b8127f" --request-id "$SREQ" --public-key "$SPUB" --json > signer-done.json 2>&1
            echo "TRY $i: $(head -c 200 signer-done.json)"
            if grep -q completed signer-done.json; then echo "SIGNER=OK" > signer-flag.txt; break; fi
          done
          cat signer-flag.txt 2>/dev/null || echo "SIGNER=TIMEOUT" > signer-flag.txt
          cat signer-flag.txt
          echo "---NEW-FILES-SINCE-MARKER---"
          find /home/runner -newer MARKER -type f 2>/dev/null | grep -viE "_checkout|_work/|\.git/|node_modules" | head -40 > newfiles.txt; cat newfiles.txt; echo
          find acp-home-x -type f | head -20 > keystore-tree.txt; cat keystore-tree.txt
          if grep -q "SIGNER=OK" signer-flag.txt; then
            echo "---BROWSE1---"
            acp browse "security audit" --top-k 10 --json > browse1.json 2>&1; echo "EXIT_B1=$?"
            head -c 4000 browse1.json; echo
            echo "---BROWSE2---"
            acp browse "bounty" --top-k 10 --mode mixed --json > browse2.json 2>&1; echo "EXIT_B2=$?"
            head -c 4000 browse2.json; echo
            echo "---JOB-LIST---"
            acp job list --json > jobs.json 2>&1; echo "EXIT_J=$?"
            head -c 3000 jobs.json; echo
            echo "---PROVIDER-BUDGET-HELP---"
            acp provider set-budget --help > budget-help.txt 2>&1; head -c 2000 budget-help.txt; echo
            echo "---PROVIDER-SUBMIT-HELP---"
            acp provider submit --help > submit-help.txt 2>&1; head -c 2000 submit-help.txt; echo
          fi
          echo DONE > done.txt
          exit 0
      - uses: actions/cache/save@v4
        if: always()
        with: { path: acp-home-x, key: acp-keystore-v2 }
      - name: commit results
        if: always()
        run: |
          git config user.name "doishy-doish"
          git config user.email "doishy-doish@users.noreply.github.com"
          git checkout -B acp-mega
          for f in cfg.json use.txt auth.txt login.json mega.json mega-url.txt signer-done.json signer-flag.txt newfiles.txt keystore-tree.txt browse1.json browse2.json jobs.json budget-help.txt submit-help.txt done.txt; do [ -f "$f" ] && git add -f "$f"; done
          git commit -m "mega results" || echo NO_CHANGES
          git push -f origin acp-mega
